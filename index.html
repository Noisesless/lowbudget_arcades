<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Tetris Low Budget</title>
<style>
  body{margin:0;background:#1a1b2e;color:#eee;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;}
  .wrap{text-align:center}
  h1{color:#7aaaff;margin-bottom:8px}
  canvas#board{background:#0d0f1a;border-radius:6px;box-shadow:0 4px 20px rgba(50,60,90,.3)}
  .panel{text-align:left;width:160px;background:#151728;padding:12px;margin-top:12px}
  button{width:100%;padding:10px;font-size:14px;cursor:pointer;border:none;border-radius:6px;margin-top:6px;background:#3a4c8f;color:white;}
</style>
</head>
<body>
<div class="wrap">
  <h1>TETRIS LOW BUDGET</h1>
  <canvas id="board" width="200" height="400"></canvas>
  <div class="panel">
    <button id="startBtn">▶ Mulai</button>
    <button id="pauseBtn">⏸ Jeda</button>
  </div>
</div>

<script>(function(){var COLS=10,ROWS=20,CELL=35;const ctx=document.getElementById("board").getContext("2d");let grid=new Array(ROWS).fill(null).map(()=>new Array(COLS).fill(null));let nextType=null,currentPiece=null,pendingRotate=false,dx=0,dy=0,score=0,level=1,paused=false,running=false;const TYPES=["I","O","T","S","Z","J","L"];function rand(){return TYPES[Math.floor(Math.random()*TYPES.length)];}function spawn(type){let cells=[[0,-2],[3,-2]];if(type==="I")cells=[[1,-1],[2,-1],[3,-1],[4,-1]];else if(type==="O")cells=[[1,-1],[2,-1],[1,0],[2,0]];else if(type==="T")cells=[[1,-1],[2,-1],[2,0]];else if(type==="S")cells=[[1,-1],[2,-1],[0,0],[1,0]];else if(type==="Z")cells=[[0,-1],[1,-1],[1,0],[2,0]];else cells=[[0,-1],[0,0],[1,0],[2,0]];return{type,color:{"I":"#31c6fc","O":"#f7d41a","T":"#ad5bff","S":"#4bd32e","Z":"#ef2b40","J":"#297dff","L":"#ff8a1e"}[type],cells};}function collides(p){for(let c of p.cells)if(c.y<0||c.x<0||c.x>=COLS||grid[c.y][c.x])return true;return false;}function merge(p){p.cells.forEach(c=>{if(c.y>=0)grid[c.y][c.x]=p.color});}function rotate(dir){let old=p.cells.map((c,i)=>({x:c.x,y:c.y,id:i}));for(let c of p.cells){let nx=-c.y,ny=c.x+dir;if(!collides({...p,cells:[{x:nx,y:ny}],color:p.color}))continue;else for(let o of old)if(o.id===c.id)c.x=o.x;c.y=o.y;}for(let i=0;i<4;i++)rotate(dir);}function clearLines(){let cleared=0;for(let y=ROWS-1;y>=0;y--){if(grid[y].every(c=>c)){grid.splice(y,1);grid.push(Array(COLS).fill(null));cleared++;y++}}return cleared;}function drop(){currentPiece.cells.forEach(c=>{c.y++;});if(collides(currentPiece))merge(currentPiece);let c=clearLines();score+=c*level;linesEl.textContent=c;c>0?level=Math.min(9,1+Math.floor(lines/10)):null;if(!drop())running=false;}function draw(){ctx.clearRect(0,0,COLS*CELL,ROWS*CELL);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(grid[y][x]){let g=x*CELL,y=y*CELL;ctx.fillStyle="rgba(255,255,255,.4)";ctx.fillRect(g+1,y+1,CELL-3,CELL-3);}}if(currentPiece){for(let c of currentPiece.cells){if(c.y<0)continue;let g=c.x*CELL,y=c.y*CELL;ctx.fillStyle=currentPiece.color;ctx.fillRect(g,y,CELL,CELL);ctx.strokeStyle="rgba(255,255,255,.6)";ctx.strokeRect(g+1,y+1,CELL-3,CELL-3);}if(pendingRotate){rotate(dy>0?1:-1);pendingRotate=false;}}else{for(let x=-3;x<COLS*CELL+x*CELL+CELL>x+4;x+=CELL)for(let y=2;y<ROWS*CELL+y*CELL+CELL>y+4;y+=CELL){ctx.strokeStyle="rgba(90,120,255,.18)";ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+CELL);ctx.stroke();}}linesEl.textContent=Math.floor(lines||0);}function update(){if(!running||paused)return;let now=performance.now(),dt=(now-lastTime)/1000;if(dt>0.5){lastTime=now;return;}dropCounter+=dt;if(dropCounter>=900/level){dropCounter-=900/level;drop();}else draw();requestAnimationFrame(update);}const linesEl=document.getElementById("lines");let dropCounter=0,lastTime=performance.now();document.getElementById("startBtn").onclick=e=>{if(running)return e.preventDefault(),e.stopPropagation(),running=false,draw();currentPiece=spawn(nextType);nextType=rand();pendingRotate=true;dx=dy
