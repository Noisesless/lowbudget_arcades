<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tetris Low Budget</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f1020;
    color: #e8e8ff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
  }
  .wrap { text-align: center; }
  h1 { font-size: 28px; margin-bottom: 14px; letter-spacing: 2px; color: #6cf; }
  .stage { display: flex; gap: 20px; align-items: flex-start; justify-content: center; }
  canvas#board { background: #05060f; border: 3px solid #3a4c8f; border-radius: 8px; box-shadow: 0 0 24px rgba(90,120,255,.3); }
  .panel { width: 170px; text-align: left; }
  .box { background: #161a33; border-radius: 8px; padding: 12px; margin-bottom: 14px; box-shadow: inset 0 0 12px rgba(0,0,0,.5); }
  .box h3 { font-size: 14px; color: #6cf; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .stat { font-size: 26px; font-weight: bold; color: #fff; }
  canvas#next { background: #05060f; border-radius: 6px; display: block; margin-bottom: 8px; }
  button {
    width: 100%; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
    background: linear-gradient(135deg, #4a7dff, #6cf); color: #fff; border: none;
    border-radius: 8px; margin-top: 6px; transition: transform .08s;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0); }
  .controls { font-size: 12px; color: #9aa; line-height: 1.7; margin-top: 6px; text-align: left; }
  kbd { background:#3a4c8f; padding: 2px 6px; border-radius: 4px; font-size: 11px; color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>TETRIS LOW BUDGET</h1>
  <div class="stage">
    <canvas id="board" width="300" height="600"></canvas>
    <div class="panel">
      <div class="box">
        <h3>Skor</h3>
        <div class="stat" id="score">0</div>
      </div>
      <div class="box">
        <h3>Level</h3>
        <div class="stat" id="level">1</div>
      </div>
      <div class="box">
        <h3>Baris Hapus</h3>
        <div class="stat" id="lines">0</div>
      </div>
    </div>
    <div class="panel">
      <div class="box">
        <h3>Next</h3>
        <canvas id="next" width="120" height="120"></canvas>
      </div>
      <button id="startBtn">▶ MULAI</button>
      <button id="pauseBtn">⏸ Jeda</button>
    </div>
  </div>
  <div class="controls controls-box" style="max-width:540px;margin:16px auto;">
    <kbd>&larr;</kbd><kbd>&rarr;</kbd> Gerak &nbsp; <kbd>&darr;</kbd> Turun cepat<br />
    <kbd>↑</kbd> atau <kbd>Spasi</kbd> Putar &nbsp; <kbd>P</kbd> Jeda
  </div>
</div>

<script>
(function () {
  "use strict";

  const COLS = 10, ROWS = 20, CELL = 30;
  const boardEl = document.getElementById("board");
  const ctx = boardEl.getContext("2d");
  const nextEl = document.getElementById("next");
  const nctx = nextEl.getContext("2d");

  const scoreEl = document.getElementById("score");
  const levelEl = document.getElementById("level");
  const linesEl = document.getElementById("lines");
  const startBtn = document.getElementById("startBtn");
  const pauseBtn = document.getElementById("pauseBtn");

  // Definisi 7 tetromino (SRS-style) dengan warna standar
  const COLORS = {
    I: "#31c6fc", O: "#f7d41a", T: "#ad5bff",
    S: "#4bd32e", Z: "#ef2b40", J: "#297dff", L: "#ff8a1e"
  };

  // Bentuk dasar tiap piece (rotasi standar)
  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[0,1],[1,1],[2,1],[1,0]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };

  const TYPES = Object.keys(SHAPES);

  let grid, current, nextType, score, level, lines, dropInterval, dropCounter, lastTime;
  let running = false, paused = false, gameOver = false;

  function newGrid() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  function randType() { return TYPES[Math.floor(Math.random() * TYPES.length)]; }

  // Membuat objek piece dengan posisi awal di atas tengah
  function spawnPiece(type) {
    const cells = SHAPES[type].map(([x, y]) => ({ x: x - 1, y: -1 }));
    return { type, cells, color: COLORS[type] };
  }

  // Cek tabrakan piece terhadap dinding/grid yang terisi
  function collides(piece) {
    for (const { x, y } of piece.cells) {
      if (y < 0) continue;                       // masih di atas layar = aman
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (grid[y][x]) return true;
    }
    return false;
  }

  function merge(piece) {
    for (const { x, y } of piece.cells) {
      if (y >= 0) grid[y][x] = piece.color;
    }
  }

  // Hapus baris penuh dan kembalikan skor
  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(c => c)) {
        grid.splice(y, 1);
        grid.push(Array(COLS).fill(null));
        cleared++;
        y++; // periksa ulang baris yang sama setelah insert
      }
    }
    return cleared;
  }

  function rotate(piece, dir) {
    const old = piece.cells.map(c => ({ x: c.x, y: c.y }));
    for (const cell of piece.cells) {
      if (piece.type === "I") {
        // Wall-kick untuk I-piece agar tidak nempel dinding saat putar
        let nx = -cell.y;
        let ny = cell.x + dir * 2;
        const kickX = Math.abs(cell.x - 1) % 4 === 0 ? (dir > 0 ? -2 : 2) : 0;
        // Rotasi I standar SRS
        nx = piece.type === "I" ? cell.y + dir * 3 : (-cell.y);
        ny = piece.type === "I" ? -(cell.x - 1) : (cell.x);
        if (!collides({ type: piece.type, cells: [{ x: nx + kickX, y: ny }], color: piece.color })) {
          cell.x = nx + kickX; cell.y = ny;
        } else { // gagal rotasi -> kembali ke posisi lama
          for (const c of piece.cells) { c.x = old.find(o => o === c)?.x ?? c.x; c.y = old.find(o => o === c)?.y ?? c.y; }
        }
      } else {
        const nx = -cell.y;
        const ny = cell.x + dir;
        if (!collides({ type: piece.type, cells: [{ x: nx, y: ny }], color: piece.color })) {
          cell.x = nx; cell.y = ny;
        } else { // wall kick sederhana untuk O/T/J/L/S/Z
          const k = (dir > 0 ? -1 : 1) * (Math.abs(cell.x - 1) % 2 === 0 ? 1 : 0);
          if (!collides({ type: piece.type, cells: [{ x: nx + k, y: ny }], color: piece.color })) {
            cell.x = nx + k; cell.y = ny;
          } else { // rotasi gagal -> kembali ke posisi lama
            for (const c of piece.cells) { if (!old.find(o => o === c)) {} }
          }
        }
      }
    }
  }

  function drop() {
    current.cells.forEach(c => { c.y++; });
    if (collides(current)) {
      for (const c of current.cells) if (c.y >= 0) grid[c.y][c.x] = current.color;
      const cleared = clearLines();
      score += [0, 40, 100, 300, 500][cleared] * level;
      lines += cleared;
      if (lines % 10 === 0) { level++; dropInterval = Math.max(80, 900 - (level - 1) * 80); }
      updateStats();
      spawnPiece(nextType);
    }
    return !collides(current); // false = game over (tidak muat lagi turun)
  }

  function hardDrop() {
    while (!collides({ type: current.type, cells: current.cells.map(c => ({ x: c.x, y: c.y + 1 })), color: current.color })) {
      current.cells.forEach(c => { c.y++; });
      score += 2;
    }
    updateStats();
    dropCounter = 0; // reset animasi jatuh cepat
  }

  function drawCell(context, x, y, color) {
    context.fillStyle = color;
    context.fillRect(x * CELL, y * CELL, CELL, CELL);
    context.strokeStyle = "rgba(255,255,255,.45)";
    context.lineWidth = 1.5;
    context.strokeRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
  }

  function draw() {
    ctx.clearRect(0, 0, boardEl.width, boardEl.height);

    // Grid garis bantu (wall)
    ctx.strokeStyle = "rgba(90,120,255,.12)";
    ctx.lineWidth = 1;
    for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke(); }
    for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke(); }

    // Board yang sudah terisi
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (grid[y][x]) drawCell(ctx, x, y, grid[y][x]);

    // Ghost piece (bayangan jatuh)
    const ghost = current.cells.map(c => ({ ...c }));
    while (!collides({ type: current.type, cells: ghost.map(c => ({ x: c.x, y: c.y + 1 })), color: current.color })) {
      ghost.forEach(c => c.y++);
    }
    for (const c of ghost) if (c.y >= 0) drawCell(ctx, c.x, c.y, "rgba(255,255,255,.14)");

    // Piece aktif
    for (const c of current.cells) {
      if (c.y < 0) continue;
      drawCell(ctx, c.x, c.y, current.color);
    }

    // Preview next piece
    nctx.clearRect(0, 0, nextEl.width, nextEl.height);
    const cells = SHAPES[nextType];
    let minX = 9, maxX = -1, minY = 9, maxY = -1;
    for (const [x, y] of cells) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
    const ox = ((maxX - minX + 1) * CELL / 2) / COLS; // offset visual (preview kecil)
    for (const [x, y] of cells) {
      const px = (x - minX) * (CELL / Math.max(3, maxX - minX));
      const py = (y - minY) * (CELL / Math.max(2, maxY - minY));
      nctx.fillStyle = COLORS[nextType];
      nctx.fillRect(px + 6, py + 6, CELL, CELL);
    }

    if (paused && running) { ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(0, 0, boardEl.width, boardEl.height); ctx.fillStyle = "#fff"; ctx.font = "bold 32px sans-serif"; ctx.textAlign = "center"; ctx.fillText("JEDA", boardEl.width / 2, boardEl.height / 2); }
    if (gameOver) { ctx.fillStyle = "rgba(0,0,0,.75)"; ctx.fillRect(0, 0, boardEl.width, boardEl.height); ctx.fillStyle = "#fff"; ctx.font = "bold 34px sans-serif"; ctx.textAlign = "center"; ctx.fillText("GAME OVER", boardEl.width / 2, boardEl.height / 2 - 10); ctx.font = "16px sans-serif"; ctx.fillText("Tekan MULAI untuk main lagi", boardEl.width / 2, boardEl.height / 2 + 24); }
    if (!running) { ctx.fillStyle = "#8cf"; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center"; ctx.fillText("Klik MULAI", boardEl.width / 2, boardEl.height / 2); }
  }

  function updateStats() {
    scoreEl.textContent = score; levelEl.textContent = level; linesEl.textContent = lines;
  }

  // ---- Game loop (ini yang sering jadi sumber bug canvas kosong) ----
  function gameLoop(time) {
    if (!running || paused) { draw(); return; }   // <-- menggambar walau jeda/gameover, layar TIDAK akan kosong
    const delta = time - lastTime;
    dropCounter += delta;
    while (dropCounter >= dropInterval) { dropCounter -= dropInterval; if (!drop()) break; }
    draw();
    lastTime = time;
    requestAnimationFrame(gameLoop);
